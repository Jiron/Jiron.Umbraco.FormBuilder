<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="jfb-mono-title" color="#16181D">
  <title id="jfb-mono-title">Jiron Form Builder</title>
  <!--
    Jiron Form Builder's mark in one colour (ADR-0267, assets/brand.md): the ribbon J as one shape in currentColor, the
    ink when nothing sets a colour. Where the colour mark changes colour, at the fold and at the dipped end, a thin
    line is cut out of it, so the fold and the end still read. For print and for anywhere one colour is all there is.
  -->
  <defs>
    <mask id="jfb-mono-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#FFFFFF" />
      <path d="M38 20 54 4" fill="none" stroke="#000000" stroke-width="2.5" />
      <path d="M10 38h15" fill="none" stroke="#000000" stroke-width="2.5" />
    </mask>
  </defs>
  <path d="M12 6h40v32a20 20 0 0 1-40 0V28h12v10a8 8 0 0 0 16 0V18H12l6-6z" fill="currentColor" mask="url(#jfb-mono-cut)" />
</svg>
