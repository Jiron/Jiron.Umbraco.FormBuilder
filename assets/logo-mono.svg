<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="jfb-mono-title" color="#16181D">
  <title id="jfb-mono-title">Jiron Form Builder</title>
  <!--
    Jiron Form Builder's mark in one colour (ROADMAP 17.1, assets/brand.md): the card in currentColor, the ink when
    nothing sets a colour, with its two fields and the check mark cut out of it, for print and for anywhere one colour
    is all there is.
  -->
  <defs>
    <mask id="jfb-mono-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#FFFFFF" />
      <rect x="14" y="12" width="36" height="8" rx="4" fill="#000000" />
      <rect x="14" y="26" width="36" height="8" rx="4" fill="#000000" />
      <path d="M17 46l5 5 10-10" fill="none" stroke="#000000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    </mask>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="14" fill="currentColor" mask="url(#jfb-mono-cut)" />
</svg>
