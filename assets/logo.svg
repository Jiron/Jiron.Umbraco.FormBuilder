<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="jfb-logo-title">
  <title id="jfb-logo-title">Jiron Form Builder</title>
  <!--
    Jiron Form Builder's mark (ADR-0267, assets/brand.md): a strip of ribbon folded into a J. The bar is the strip's
    far side, in the deep blue, its end cut to a swallowtail; at the fold the strip turns and comes down in Ligata's
    blue, round the hook, to an end dipped in marigold. Every corner sits on an even unit of the 64 unit grid, so each
    edge falls on a whole pixel at 32 px. The bar runs on under the fold and the hook under the tip, so no seam shows
    where two colours meet.
  -->
  <path d="M12 6h40v12H12l6-6z" fill="#1637A8" />
  <path d="M52 6v32a20 20 0 0 1-40 0v-2h12v2a8 8 0 0 0 16 0V18z" fill="#2457F5" />
  <path d="M12 28h12v10H12z" fill="#F5BF4F" />
</svg>
