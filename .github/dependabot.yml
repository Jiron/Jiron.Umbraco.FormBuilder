# Dependency updates (ROADMAP 3.5). The pull request limit stays 0 until the owner raises it (docs/OWNER-TODO.md):
# nobody reviews the pull requests while the roadmap runs. scripts/check-workflows.mjs checks this file.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # 9.x comes with a maintenance-fee agreement (CLAUDE.md rule 4); 8.0.5 is the last MIT release (ADR-0034).
      - dependency-name: JsonSchema.Net
        versions: [">= 9.0.0"]
  - package-ecosystem: npm
    directories:
      - /scripts
      - /src/Jiron.Umbraco.FormBuilder.Web/Client
      - /tests/e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
