# Jiron Form Builder's CI (ROADMAP 3.5, ADR-0011). scripts/ci-local.ps1 runs the same checks locally, without
# SQL Server, which the development machine never connects to (CLAUDE.md rule 6).
#
# A targeted run (targeted.yml, by hand) calls it with the inputs `only` and `shares` to run one part, such as one
# integration share of one database (scripts/ci-selection.mjs); a push, a tag and the release give none and run all.
#
# Gated to save the private repository's Actions minutes (D17): a run started by hand always runs, and so does the
# release (release.yml), which calls this workflow for a version tag, so a tag runs CI once (ADR-0247). Pushes to main
# and to v18/main (the Umbraco 18 line, Phase 19) run only when the owner sets the repository variable JFB_CI to
# 'true'; until then every job's `if` is false and the push run ends at once, without a runner.
name: CI

on:
  push:
    branches: [main, v18/main]
  # The release calls it for a version tag, without inputs; the jobs' conditions let a tag through.
  workflow_call:
    inputs:
      only:
        description: 'The part to run: all, build, sqlite, sqlserver, smoke or loadbalancing'
        type: string
        default: all
      shares:
        description: 'With only sqlite or sqlserver: a JSON list of its share names, such as ["3","timed"]; empty for every share'
        type: string
        default: ''
  workflow_dispatch:

permissions:
  contents: read

# Called by another workflow, the group is this run's own beside its caller's: targeted runs of different parts go side
# by side, and a newer run of the same part replaces the older one. A push and a tag give no inputs.
concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.only }}-${{ inputs.shares }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # Restore and scripts/third-party-notices.mjs read the same packages folder (ROADMAP 3.5).
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # In seconds: which jobs and shares this run runs; a wrong input fails here (scripts/ci-selection.mjs).
  selection:
    name: What this run runs
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || vars.JFB_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.select.outputs.build }}
      sqlite: ${{ steps.select.outputs.sqlite }}
      sqlserver: ${{ steps.select.outputs.sqlserver }}
      smoke: ${{ steps.select.outputs.smoke }}
      loadbalancing: ${{ steps.select.outputs.loadbalancing }}
      everything: ${{ steps.select.outputs.everything }}
      sqlite-shares: ${{ steps.select.outputs.sqlite-shares }}
      sqlserver-shares: ${{ steps.select.outputs.sqlserver-shares }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The inputs reach the script through the environment, never inline (ADR-0247).
      - name: The part and the shares
        id: select
        env:
          ONLY: ${{ inputs.only }}
          SHARES: ${{ inputs.shares }}
        run: node scripts/ci-selection.mjs

  build:
    name: Build, checks and tests (SQLite)
    needs: selection
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || vars.JFB_CI == 'true') && needs.selection.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            src/Jiron.Umbraco.FormBuilder.Web/Client/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'NuGet.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Repository checks
        run: |
          npm ci --prefix scripts --no-audit --no-fund
          node scripts/secret-scan.mjs --tracked
          node scripts/term-guard.mjs --tracked
          node scripts/check-text.mjs --tracked
          node scripts/check-workflows.mjs
          node scripts/check-audit-suppressions.mjs
          node scripts/check-npm-licences.mjs
          node scripts/check-marketplace.mjs --ci
      # The script tests render two small pages; in CI they use Playwright's Chromium (scripts/lib/browser.mjs).
      - name: Install Chromium for the script tests
        working-directory: scripts
        run: npx playwright install --with-deps chromium
      - name: Script tests
        run: node --test "scripts/tests/*.test.mjs"

      - name: Client lint, tests and build
        working-directory: src/Jiron.Umbraco.FormBuilder.Web/Client
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Client size budgets
        run: node scripts/size-check.mjs

      - name: Restore
        run: dotnet restore
      - name: Build (warnings are errors)
        run: dotnet build -c Release --no-restore
      - name: Formatting
        run: dotnet format --verify-no-changes --no-restore
      - name: NuGet licences and third-party notices
        run: |
          node scripts/check-nuget-licences.mjs
          node scripts/third-party-notices.mjs --check
      - name: Packages
        run: node scripts/pack.mjs --no-build --output artifacts/packages
      # The integration tests run in the share jobs below (ADR-0261).
      - name: Unit and AI tests
        run: |
          dotnet test tests/Jiron.Umbraco.FormBuilder.Tests.Unit -c Release --no-build --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none --logger trx --results-directory TestResults/unit
          dotnet test tests/Jiron.Umbraco.FormBuilder.Tests.AI -c Release --no-build --blame-hang --blame-hang-timeout 10m --blame-hang-dump-type none --logger trx --results-directory TestResults/unit

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit
          path: TestResults/unit
          if-no-files-found: ignore
      - name: Upload the packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages
          if-no-files-found: ignore

  # The integration tests in shares, one process per job, through scripts/test-integration.mjs (ADR-0261): share i of
  # n runs the classes tests/integration-times.json gives it, the last share whatever the others do not name, and the
  # "timed" job the tests that hold the product to a time budget, alone on its runner. The `shares` job adds up what
  # every job ran and fails unless it is exactly the assembly's tests.
  #
  # How many shares, estimated (a hosted runner cannot be measured from the development machine): on that machine one
  # process runs the 2,313 tests in 37.5 minutes (2,250 s of test time, 2,170 s without the timed ones; ADR-0261).
  # Taken as twice as slow on a hosted runner, and the plan's shares as up to 10% uneven:
  #   - SQLite, 6 shares: 2,170 s x 2 / 6 x 1.1 = about 13 minutes of tests per job;
  #   - SQL Server, 10 shares, taken as half as slow again as SQLite: 2,170 s x 3 / 10 x 1.1 = about 12 minutes;
  #   - the timed job: 80 s on the development machine, so about 3 minutes;
  # plus about 7 minutes per job for the checkout, the client build and the Release build of the test project. That
  # plans every job at 20 minutes at most, under half of its 45. When the jobs' times are known, change the share
  # count (the matrix's numbers and JFB_SHARES together) so the longest job stays under 22 minutes.
  sqlite:
    name: Integration tests (SQLite, share ${{ matrix.share }})
    needs: selection
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || vars.JFB_CI == 'true') && needs.selection.outputs.sqlite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        share: ${{ fromJSON(needs.selection.outputs.sqlite-shares) }}
    env:
      JFB_SHARES: '6'
      SHARE: ${{ matrix.share }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            src/Jiron.Umbraco.FormBuilder.Web/Client/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'NuGet.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # The website assets are embedded in the build, as in the build job and the gate.
      - name: Client build
        working-directory: src/Jiron.Umbraco.FormBuilder.Web/Client
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # The scripts' packages hold the emulator the blob store's tests start (Azurite, ROADMAP 26.1).
      - name: Install the scripts' packages
        run: npm ci --prefix scripts --no-audit --no-fund
      - name: Build the integration tests
        run: dotnet build tests/Jiron.Umbraco.FormBuilder.Tests.Integration -c Release
      - name: Integration tests (SQLite)
        run: |
          if [ "$SHARE" = timed ]; then share=timed; else share="$SHARE/$JFB_SHARES"; fi
          node scripts/test-integration.mjs --share "$share" --results TestResults/integration
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-sqlite-${{ matrix.share }}
          path: TestResults/integration
          if-no-files-found: ignore

  sqlserver:
    name: Integration tests (SQL Server, share ${{ matrix.share }})
    needs: selection
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || vars.JFB_CI == 'true') && needs.selection.outputs.sqlserver == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One process per job: two on one server would collide on the test databases' names.
    strategy:
      fail-fast: false
      matrix:
        share: ${{ fromJSON(needs.selection.outputs.sqlserver-shares) }}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          # A throwaway password for this run's container only; nothing outside the job reaches it.
          MSSQL_SA_PASSWORD: ${{ format('Jfb-{0}-{1}-Ci', github.run_id, github.run_attempt) }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      # Umbraco's integration test base reads these (Tests:Database) and creates its test databases on this server.
      Tests__Database__DatabaseType: SqlServer
      Tests__Database__SQLServerMasterConnectionString: Server=localhost,1433;User Id=sa;Password=${{ format('Jfb-{0}-{1}-Ci', github.run_id, github.run_attempt) }};TrustServerCertificate=True
      JFB_SHARES: '10'
      SHARE: ${{ matrix.share }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            scripts/package-lock.json
            src/Jiron.Umbraco.FormBuilder.Web/Client/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'NuGet.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Client build
        working-directory: src/Jiron.Umbraco.FormBuilder.Web/Client
        run: |
          npm ci --no-audit --no-fund
          npm run build
      # The scripts' packages hold the emulator the blob store's tests start (Azurite, ROADMAP 26.1).
      - name: Install the scripts' packages
        run: npm ci --prefix scripts --no-audit --no-fund
      - name: Build the integration tests
        run: dotnet build tests/Jiron.Umbraco.FormBuilder.Tests.Integration -c Release
      - name: Integration tests (SQL Server)
        run: |
          if [ "$SHARE" = timed ]; then share=timed; else share="$SHARE/$JFB_SHARES"; fi
          node scripts/test-integration.mjs --share "$share" --results TestResults/integration
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-sqlserver-${{ matrix.share }}
          path: TestResults/integration
          if-no-files-found: ignore

  # Every share of both databases reported, none failed, and together they ran exactly the assembly's tests, each once:
  # only a run of everything can add up.
  shares:
    name: Integration tests add up
    needs: [selection, sqlite, sqlserver]
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || vars.JFB_CI == 'true') && needs.selection.outputs.everything == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: integration-sqlite-*
          path: shares/sqlite
      - uses: actions/download-artifact@v8
        with:
          pattern: integration-sqlserver-*
          path: shares/sqlserver
      - name: The SQLite shares add up
        run: node scripts/test-integration.mjs --sum shares/sqlite
      - name: The SQL Server shares add up
        run: node scripts/test-integration.mjs --sum shares/sqlserver

  smoke:
    name: Browser tests (smoke)
    needs: selection
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || vars.JFB_CI == 'true') && needs.selection.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Jiron.Umbraco.FormBuilder.Web/Client/package-lock.json
            tests/e2e/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'NuGet.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Install the browser tests
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npx playwright install --with-deps chromium
      # The fonts decide where text wraps, and the layout specs measure it: the log says which faces the runner has.
      - name: The fonts the runner resolves
        run: |
          fc-match sans-serif
          fc-match system-ui
          fc-match monospace
          echo "font families: $(fc-list : family | sort -u | wc -l)"
      # The global set-up builds the client and the demo, and starts a fresh host on port 5520 (ADR-0031).
      - name: Smoke and website tests (Chromium)
        working-directory: tests/e2e
        run: npx playwright test --project=smoke --project=website
      - name: Upload the report, the traces and the host's log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke
          path: |
            .local/e2e/report
            .local/e2e/results
            .local/e2e/host-5520/host.log
          if-no-files-found: ignore

  loadbalancing:
    name: Load balancing (two demo instances, SQL Server)
    needs: selection
    if: (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || vars.JFB_CI == 'true') && needs.selection.outputs.loadbalancing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ format('Jfb-{0}-{1}-Ci', github.run_id, github.run_attempt) }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ${MSSQL_SA_PASSWORD} -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      SA_PASSWORD: ${{ format('Jfb-{0}-{1}-Ci', github.run_id, github.run_attempt) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            src/Jiron.Umbraco.FormBuilder.Web/Client/package-lock.json
            tests/e2e/package-lock.json
      - uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'NuGet.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # Both hosts of the suite (ports 5533 and 5534, ROADMAP 4.11) share this database.
      - name: Create the shared database
        run: docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -b -Q "CREATE DATABASE JfbLoadBalancing"
      - name: Install the browser tests
        working-directory: tests/e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      # The `lb` project starts the two hosts itself: every run is delivered once, whichever server got the submission.
      - name: Load-balancing suite (Chromium)
        working-directory: tests/e2e
        run: npx playwright test --project=lb
      - name: Upload the report and the logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-loadbalancing
          path: |
            .local/e2e/report
            .local/e2e/results
            .local/e2e/lb-5533/host.log
            .local/e2e/lb-5534/host.log
          if-no-files-found: ignore
